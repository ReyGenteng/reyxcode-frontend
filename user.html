<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reyxcode | User Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { cyber: { bg: '#0a0a0f', card: 'rgba(20, 20, 30, 0.75)', cyan: '#00f3ff', purple: '#bc13fe' } } }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(20, 20, 30, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(0, 243, 255, 0.2); }
        .btn-cyber { background: linear-gradient(45deg, #bc13fe, #00f3ff); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="glass-panel sticky top-0 z-50 border-b border-cyber-cyan/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-cyber-cyan text-2xl"></i>
                <span class="font-bold text-2xl text-white">reyx<span class="text-cyber-cyan">code</span></span>
            </a>
            <div id="userInfoNav" class="flex items-center gap-3"></div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Auth Views -->
        <div id="authView" class="max-w-md mx-auto pt-6">
            <div class="glass-panel p-8 rounded-2xl">
                <h2 id="authTitle" class="text-2xl font-bold text-center text-white mb-4">Masuk Akun</h2>
                <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <div id="userField" class="hidden">
                        <label class="block text-xs font-semibold text-cyber-cyan mb-1">Username</label>
                        <input type="text" id="regUser" placeholder="Username" class="w-full bg-black/60 border border-cyber-cyan/30 text-white rounded-lg p-2.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-cyber-cyan mb-1">Email</label>
                        <input type="email" id="authEmail" required placeholder="email@gmail.com" class="w-full bg-black/60 border border-cyber-cyan/30 text-white rounded-lg p-2.5 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-cyber-cyan mb-1">Password</label>
                        <input type="password" id="authPass" required placeholder="••••••••" class="w-full bg-black/60 border border-cyber-cyan/30 text-white rounded-lg p-2.5 text-xs">
                    </div>
                    <button type="submit" id="btnAuth" class="btn-cyber w-full py-3 rounded-lg font-bold text-white text-xs uppercase">Masuk</button>
                </form>
                <div class="mt-4 text-center text-xs text-gray-400">
                    <span id="authToggleText">Belum punya akun?</span> 
                    <a href="javascript:void(0)" onclick="toggleAuthMode()" id="authToggleBtn" class="text-cyber-cyan font-bold">Daftar</a>
                </div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboardView" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-panel p-6 rounded-2xl">
                    <h2 class="text-xl font-bold text-white mb-4"><i class="fa-solid fa-cart-plus text-cyber-cyan mr-2"></i>Sewa Nomor</h2>
                    <div class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold text-cyber-cyan mb-1">Negara</label>
                            <select id="userCountrySelect" onchange="loadUserOperators()" class="w-full bg-black/60 border border-cyber-cyan/30 text-white rounded-lg p-2.5">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-cyber-cyan mb-1">Aplikasi</label>
                            <select id="userServiceSelect" onchange="loadUserOperators()" class="w-full bg-black/60 border border-cyber-cyan/30 text-white rounded-lg p-2.5">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-cyber-cyan mb-1">Operator</label>
                            <select id="userOperatorSelect" onchange="calculateBestPrice()" class="w-full bg-black/60 border border-cyber-cyan/30 text-white rounded-lg p-2.5">
                                <option value="">Semua Operator (Termurah)</option>
                            </select>
                        </div>
                        <div id="priceInfoCard" class="hidden p-4 rounded-xl bg-black/40 border border-cyber-purple/30 space-y-2">
                            <div class="flex justify-between text-gray-400"><span>Stok:</span><span id="dispStock" class="font-bold text-white">0</span></div>
                            <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                                <span class="font-bold text-gray-300">Harga Final (+50%):</span>
                                <span id="dispFinalPrice" class="font-mono text-xl font-bold text-cyber-cyan">IDR 0</span>
                            </div>
                        </div>
                        <button id="btnOrderNokos" onclick="executeOrderNokos()" class="btn-cyber w-full py-3.5 rounded-lg font-bold text-white text-sm">Order Sekarang</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-list-check text-cyber-cyan mr-2"></i>Nomor Aktif</h2>
                    <button onclick="pollActiveOrders()" class="text-xs text-cyber-cyan border border-cyber-cyan/40 px-3 py-1.5 rounded-lg">Refresh</button>
                </div>
                <div id="userOrdersContainer" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        // MASUKKAN URL BACKEND VERCEL KAMU DI SINI
        const BACKEND_URL = "https://reyxcode-backendd.vercel.app"; 
        const firebaseConfig = {
    apiKey: "AIzaSyBbW70TerXmSJcPgc7Lsj4Mjd35DDrPM0I",
    authDomain: "reystore-777b5.firebaseapp.com",
    databaseURL: "https://reystore-777b5-default-rtdb.firebaseio.com",
    projectId: "reystore-777b5",
    storageBucket: "reystore-777b5.firebasestorage.app",
    messagingSenderId: "1075601006300",
    appId: "1:1075601006300:web:2e82a477211dfdce9c5e19"
};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserData = null;
        let selectedProductTier = null;
        let isRegisterMode = false;

        document.addEventListener("DOMContentLoaded", () => {
            if (window.location.hash === '#register') toggleAuthMode(true);
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    db.ref(`users/${user.uid}`).on('value', snap => {
                        currentUserData = snap.val();
                        if (currentUserData) {
                            currentUserData.uid = user.uid;
                            document.getElementById('authView').classList.add('hidden');
                            document.getElementById('dashboardView').classList.remove('hidden');
                            document.getElementById('userInfoNav').innerHTML = `
                                <div class="text-right text-xs">
                                    <span class="block text-gray-400">Saldo</span>
                                    <span class="font-mono font-bold text-cyber-cyan">Rp ${(currentUserData.balance || 0).toLocaleString('id-ID')}</span>
                                </div>
                                <button onclick="auth.signOut()" class="text-xs text-red-400 ml-2"><i class="fa-solid fa-power-off"></i></button>
                            `;
                            loadUserCatalog();
                            pollActiveOrders();
                        }
                    });
                } else {
                    document.getElementById('authView').classList.remove('hidden');
                    document.getElementById('dashboardView').classList.add('hidden');
                    document.getElementById('userInfoNav').innerHTML = '';
                }
            });
        });

        function toggleAuthMode(forceReg = false) {
            isRegisterMode = forceReg || !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "Daftar Akun" : "Masuk Akun";
            document.getElementById('userField').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('btnAuth').innerText = isRegisterMode ? "Daftar" : "Masuk";
            document.getElementById('authToggleText').innerText = isRegisterMode ? "Sudah punya akun?" : "Belum punya akun?";
            document.getElementById('authToggleBtn').innerText = isRegisterMode ? "Masuk" : "Daftar";
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const username = document.getElementById('regUser').value.trim();

            try {
                if (isRegisterMode) {
                    const cred = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.ref(`users/${cred.user.uid}`).set({ username, email, role: 'user', balance: 0, created_at: new Date().toISOString() });
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (err) {
                Swal.fire({icon: 'error', title: 'Error', text: err.message});
            }
        }

        async function loadUserCatalog() {
            const resC = await fetch(`${BACKEND_URL}/api/countries`).then(r => r.json());
            const resS = await fetch(`${BACKEND_URL}/api/services`).then(r => r.json());
            if (resC.success) document.getElementById('userCountrySelect').innerHTML = '<option value="">-- Pilih Negara --</option>' + resC.data.filter(c => c.active).map(c => `<option value="${c.id}">${c.emoji || ''} ${c.name}</option>`).join('');
            if (resS.success) document.getElementById('userServiceSelect').innerHTML = '<option value="">-- Pilih Layanan --</option>' + resS.data.filter(s => s.active).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }

        async function loadUserOperators() {
            const countryId = document.getElementById('userCountrySelect').value;
            const serviceId = document.getElementById('userServiceSelect').value;
            if (!countryId || !serviceId) return;

            const res = await fetch(`${BACKEND_URL}/api/operators?country_id=${countryId}&platform_id=${serviceId}`).then(r => r.json());
            const opSel = document.getElementById('userOperatorSelect');
            opSel.innerHTML = '<option value="">Semua Operator (Termurah)</option>';
            if (res.success && res.data) res.data.forEach(op => { if (op.operator_id !== null) opSel.innerHTML += `<option value="${op.operator_id}">${op.name || op.code}</option>`; });
            calculateBestPrice();
        }

        async function calculateBestPrice() {
            const countryId = document.getElementById('userCountrySelect').value;
            const serviceId = document.getElementById('userServiceSelect').value;
            const operatorId = document.getElementById('userOperatorSelect').value;
            const card = document.getElementById('priceInfoCard');

            if (!countryId || !serviceId) return card.classList.add('hidden');
            card.classList.remove('hidden');

            let url = `${BACKEND_URL}/api/price-estimate?country_id=${countryId}&platform_id=${serviceId}`;
            if (operatorId) url += `&operator_id=${operatorId}`;

            const res = await fetch(url).then(r => r.json());
            if (res.success) {
                selectedProductTier = res.data;
                document.getElementById('dispStock').innerText = `${res.data.available} nomor (${res.data.operator_name})`;
                document.getElementById('dispFinalPrice').innerText = `Rp ${res.data.user_price.toLocaleString('id-ID')}`;
            } else {
                document.getElementById('dispStock').innerText = '0 (Stok Habis)';
                document.getElementById('dispFinalPrice').innerText = 'N/A';
                selectedProductTier = null;
            }
        }

        async function executeOrderNokos() {
            if (!selectedProductTier) return Swal.fire({icon: 'warning', text: 'Stok tidak tersedia!'});

            const res = await fetch(`${BACKEND_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: currentUserData.uid,
                    catalog_product_id: selectedProductTier.catalog_product_id,
                    operator_id: document.getElementById('userOperatorSelect').value || null
                })
            }).then(r => r.json());

            if (res.success) {
                Swal.fire({icon: 'success', title: 'Berhasil Order!', text: res.data.order.phone_number});
                pollActiveOrders();
            } else {
                Swal.fire({icon: 'error', text: res.error.message});
            }
        }

        async function pollActiveOrders() {
            if (!currentUserData) return;
            const snap = await db.ref('orders').orderByChild('uid').equalTo(currentUserData.uid).once('value');
            const localOrders = snap.val() || {};
            const activeRes = await fetch(`${BACKEND_URL}/api/orders/active`).then(r => r.json());
            
            const liveMap = new Map();
            if (activeRes.success && activeRes.data) activeRes.data.forEach(o => liveMap.set(o.id, o));

            const container = document.getElementById('userOrdersContainer');
            const keys = Object.keys(localOrders);
            if (keys.length === 0) return container.innerHTML = `<div class="glass-panel p-6 text-center text-gray-500 text-xs rounded-xl">Belum ada orderan aktif.</div>`;

            container.innerHTML = '';
            keys.reverse().forEach(k => {
                const ord = localOrders[k];
                const live = liveMap.get(ord.order_id);
                const status = live ? live.status : ord.status;
                const otp = live ? live.otp_code : null;

                container.innerHTML += `
                    <div class="glass-panel p-4 rounded-xl space-y-2 text-xs">
                        <div class="flex justify-between font-mono">
                            <span class="text-white font-bold">${ord.phone}</span>
                            <span class="text-cyber-cyan font-bold">${status}</span>
                        </div>
                        <div class="bg-black/50 p-3 rounded text-green-400 font-mono text-lg font-bold">${otp || live?.otp_message || 'Menunggu SMS...'}</div>
                        ${status === 'ACTIVE' ? `<button onclick="cancelOrder(${ord.order_id})" class="bg-red-500/20 text-red-400 px-3 py-1 rounded">Cancel & Refund</button>` : ''}
                    </div>
                `;
            });
        }

        async function cancelOrder(id) {
            const res = await fetch(`${BACKEND_URL}/api/order/cancel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: id, uid: currentUserData.uid })
            }).then(r => r.json());

            if (res.success) {
                Swal.fire({icon: 'success', title: 'Canceled & Refunded'});
                pollActiveOrders();
            }
        }
    </script>
</body>
</html>
