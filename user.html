<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reyxcode | Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { bg: '#0d0d12', card: '#16161f', accent: '#ff4d4d', success: '#00e57a', border: '#2a2a35', input: '#1a1a24' } } }
            }
        }
    </script>
    <style>
        body { background-color: #0d0d12; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .smscode-card { background-color: #16161f; border: 1px solid #2a2a35; border-radius: 1rem; }
        .smscode-btn { background-color: #ff4d4d; color: white; transition: all 0.2s; }
        .smscode-btn:hover { background-color: #ff3333; transform: translateY(-1px); }
        .smscode-input { background-color: #1a1a24; border: 1px solid #2a2a35; color: white; border-radius: 0.75rem; transition: all 0.2s; }
        .smscode-input:focus { border-color: #ff4d4d; outline: none; background-color: #22222f; }
        .stat-box { background-color: #1a1a24; border: 1px solid #2a2a35; border-radius: 1rem; padding: 1.25rem; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a5a; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[#0d0d12]/90 backdrop-blur-md border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-brand-accent flex items-center justify-center text-white font-bold">R</div>
                <span class="font-bold text-xl tracking-tight hidden sm:block">reyxcode</span>
            </a>
            <div id="userInfoNav" class="flex items-center gap-4">
                <!-- User info / logout akan dimuat di sini -->
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-start justify-center p-4 sm:p-6 w-full">
        
        <!-- ==================== AUTH VIEW (LOGIN/REGISTER) ==================== -->
        <div id="authView" class="w-full max-w-md mt-10">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-full bg-brand-accent mx-auto flex items-center justify-center text-white font-bold text-2xl mb-4">R</div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-tight">Sign In to Dashboard</h2>
                <p class="text-gray-400 text-sm mt-2">Manage your virtual numbers & OTPs.</p>
            </div>
            
            <div class="smscode-card p-6 sm:p-8">
                <form onsubmit="handleAuthSubmit(event)" class="space-y-5">
                    <div id="userField" class="hidden">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username</label>
                        <input type="text" id="regUser" placeholder="johndoe" class="smscode-input w-full p-3.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" id="authEmail" required placeholder="name@example.com" class="smscode-input w-full p-3.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                        <input type="password" id="authPass" required placeholder="••••••••" class="smscode-input w-full p-3.5 text-sm">
                    </div>
                    <button type="submit" id="btnAuth" class="smscode-btn w-full py-3.5 rounded-xl font-bold text-sm mt-2">Continue</button>
                </form>
                
                <div class="mt-6 pt-6 border-t border-brand-border text-center text-sm text-gray-400">
                    <span id="authToggleText">Don't have an account?</span> 
                    <a href="javascript:void(0)" onclick="toggleAuthMode()" id="authToggleBtn" class="text-white font-semibold hover:text-brand-accent transition-colors">Sign Up</a>
                </div>
            </div>
        </div>

        <!-- ==================== DASHBOARD VIEW ==================== -->
        <div id="dashboardView" class="hidden w-full max-w-7xl mx-auto space-y-6">
            
            <!-- Welcome Banner -->
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight">Welcome back,</h1>
                <h2 id="welcomeUsername" class="text-3xl font-extrabold text-brand-accent">User 👋</h2>
            </div>

            <!-- Stats Row -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="stat-box">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Balance</span>
                        <i class="fa-solid fa-wallet text-brand-success bg-brand-success/10 p-2 rounded-lg"></i>
                    </div>
                    <div id="dispSaldoStat" class="text-2xl font-bold">Rp 0</div>
                </div>
                <div class="stat-box">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Active</span>
                        <i class="fa-solid fa-heart-pulse text-brand-accent bg-brand-accent/10 p-2 rounded-lg"></i>
                    </div>
                    <div class="text-2xl font-bold">0</div>
                </div>
                <!-- Kamu bisa tambahkan stat lain jika punya datanya -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-6">
                <!-- PANEL KIRI: ORDER BARU -->
                <div class="lg:col-span-4">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><span class="text-brand-accent">❯</span> New Order</h3>
                    
                    <div class="smscode-card p-5 space-y-5">
                        
                        <!-- Pilihan Aplikasi -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Service</label>
                            <div class="relative">
                                <i class="fa-solid fa-search absolute left-3 top-3.5 text-gray-500 text-sm"></i>
                                <select id="userServiceSelect" onchange="loadUserOperators()" class="smscode-input w-full p-3 pl-10 text-sm appearance-none cursor-pointer">
                                    <option value="">-- Select Service --</option>
                                </select>
                            </div>
                        </div>

                        <!-- Pilihan Negara -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Country</label>
                            <div class="relative">
                                <i class="fa-solid fa-globe absolute left-3 top-3.5 text-gray-500 text-sm"></i>
                                <select id="userCountrySelect" onchange="loadUserOperators()" class="smscode-input w-full p-3 pl-10 text-sm appearance-none cursor-pointer">
                                    <option value="">-- Select Country --</option>
                                </select>
                            </div>
                        </div>

                        <!-- Pilihan Operator -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Operator</label>
                            <div class="relative">
                                <i class="fa-solid fa-tower-cell absolute left-3 top-3.5 text-gray-500 text-sm"></i>
                                <select id="userOperatorSelect" onchange="calculateBestPrice()" class="smscode-input w-full p-3 pl-10 text-sm appearance-none cursor-pointer">
                                    <option value="">Any Operator (Cheapest)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Info Harga -->
                        <div id="priceInfoCard" class="hidden bg-[#1a1a24] p-4 rounded-xl border border-brand-border">
                            <div class="flex justify-between items-center text-sm mb-2">
                                <span class="text-gray-400">Available Stock</span>
                                <span id="dispStock" class="font-medium bg-[#0d0d12] px-2 py-1 rounded text-xs">0</span>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-brand-border/50">
                                <span class="text-gray-400 text-sm">Price per SMS</span>
                                <span id="dispFinalPrice" class="font-bold text-brand-success text-lg">Rp 0</span>
                            </div>
                        </div>

                        <button id="btnOrderNokos" onclick="executeOrderNokos()" class="smscode-btn w-full py-3.5 rounded-xl font-bold text-sm flex justify-center items-center gap-2">
                            Place Order <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- PANEL KANAN: LIST ORDER -->
                <div class="lg:col-span-8">
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="text-lg font-bold">Your Orders</h3>
                        <button onclick="pollActiveOrders()" class="text-xs text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh</button>
                    </div>

                    <div class="smscode-card overflow-hidden">
                        <!-- Filter Tabs Imitasi -->
                        <div class="flex gap-4 p-4 border-b border-brand-border bg-[#1a1a24] overflow-x-auto">
                            <span class="px-4 py-1.5 bg-[#2a2a35] text-white text-xs font-semibold rounded-full border border-gray-600">All Orders</span>
                            <span class="px-4 py-1.5 text-gray-400 text-xs font-semibold rounded-full hover:bg-[#2a2a35] transition-colors cursor-pointer">Active</span>
                        </div>
                        
                        <div id="userOrdersContainer" class="p-2 sm:p-4 space-y-2 max-h-[600px] overflow-y-auto">
                            <!-- Order list will be injected here -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // MASUKKAN URL BACKEND VERCEL/RAILWAY KAMU DI SINI
        const BACKEND_URL = "https://reyxcode-backend-production.up.railway.app"; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyBbW70TerXmSJcPgc7Lsj4Mjd35DDrPM0I",
            authDomain: "reystore-777b5.firebaseapp.com",
            databaseURL: "https://reystore-777b5-default-rtdb.firebaseio.com",
            projectId: "reystore-777b5",
            storageBucket: "reystore-777b5.firebasestorage.app",
            messagingSenderId: "1075601006300",
            appId: "1:1075601006300:web:2e82a477211dfdce9c5e19"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserData = null;
        let selectedProductTier = null;
        let isRegisterMode = false;

        document.addEventListener("DOMContentLoaded", () => {
            if (window.location.hash === '#register') toggleAuthMode(true);
            
            // FIX: Pengecekan Auth & Routing Role
            auth.onAuthStateChanged(user => {
                if (user) {
                    db.ref(`users/${user.uid}`).on('value', snap => {
                        currentUserData = snap.val();
                        if (currentUserData) {
                            currentUserData.uid = user.uid;
                            
                            // JIKA DIA ADMIN, LEMPAR KE ADMIN.HTML (kecuali dia sengaja maksa buka user.html)
                            if (currentUserData.role === 'admin' && !window.location.href.includes('user.html?force=true')) {
                                window.location.replace("admin.html");
                                return;
                            }

                            // Tampilkan Dashboard
                            document.getElementById('authView').classList.add('hidden');
                            document.getElementById('dashboardView').classList.remove('hidden');
                            
                            // Set UI
                            document.getElementById('welcomeUsername').innerText = (currentUserData.username || 'User') + ' 👋';
                            document.getElementById('dispSaldoStat').innerText = `Rp ${(currentUserData.balance || 0).toLocaleString('id-ID')}`;
                            
                            document.getElementById('userInfoNav').innerHTML = `
                                <div class="hidden sm:flex items-center gap-3 mr-4">
                                    <span class="text-sm text-gray-300">${currentUserData.email}</span>
                                </div>
                                <button onclick="auth.signOut()" class="text-sm text-brand-accent hover:text-white transition-colors font-medium flex items-center gap-2">
                                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Log out</span>
                                </button>
                            `;
                            
                            loadUserCatalog();
                            pollActiveOrders();
                        }
                    });
                } else {
                    document.getElementById('authView').classList.remove('hidden');
                    document.getElementById('dashboardView').classList.add('hidden');
                    document.getElementById('userInfoNav').innerHTML = '';
                }
            });
        });

        function toggleAuthMode(forceReg = false) {
            isRegisterMode = forceReg || !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? "Create an Account" : "Sign In to Dashboard";
            document.getElementById('userField').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('btnAuth').innerText = isRegisterMode ? "Create Account" : "Continue";
            document.getElementById('authToggleText').innerText = isRegisterMode ? "Already have an account?" : "Don't have an account?";
            document.getElementById('authToggleBtn').innerText = isRegisterMode ? "Sign In" : "Sign Up";
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const username = document.getElementById('regUser').value.trim();

            const btn = document.getElementById('btnAuth');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                if (isRegisterMode) {
                    const cred = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.ref(`users/${cred.user.uid}`).set({ username, email, role: 'user', balance: 0, created_at: new Date().toISOString() });
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (err) {
                Swal.fire({icon: 'error', title: 'Error', text: err.message, background: '#16161f', color: '#fff'});
            } finally {
                btn.innerHTML = isRegisterMode ? 'Create Account' : 'Continue';
                btn.disabled = false;
            }
        }

        async function loadUserCatalog() {
            try {
                const resC = await fetch(`${BACKEND_URL}/api/countries`).then(r => r.json());
                const resS = await fetch(`${BACKEND_URL}/api/services`).then(r => r.json());
                
                if (resC.success) {
                    document.getElementById('userCountrySelect').innerHTML = '<option value="">-- Select Country --</option>' + 
                        resC.data.filter(c => c.active).map(c => `<option value="${c.id}">${c.emoji || ''} ${c.name}</option>`).join('');
                }
                if (resS.success) {
                    document.getElementById('userServiceSelect').innerHTML = '<option value="">-- Select Service --</option>' + 
                        resS.data.filter(s => s.active).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                }
            } catch (e) {
                console.error("Gagal load katalog:", e);
            }
        }

        async function loadUserOperators() {
            const countryId = document.getElementById('userCountrySelect').value;
            const serviceId = document.getElementById('userServiceSelect').value;
            if (!countryId || !serviceId) return;

            try {
                const res = await fetch(`${BACKEND_URL}/api/operators?country_id=${countryId}&platform_id=${serviceId}`).then(r => r.json());
                const opSel = document.getElementById('userOperatorSelect');
                opSel.innerHTML = '<option value="">Any Operator (Cheapest)</option>';
                if (res.success && res.data) {
                    res.data.forEach(op => { 
                        if (op.operator_id !== null) opSel.innerHTML += `<option value="${op.operator_id}">${op.name || op.code}</option>`; 
                    });
                }
                calculateBestPrice();
            } catch(e) { console.error(e); }
        }

        async function calculateBestPrice() {
            const countryId = document.getElementById('userCountrySelect').value;
            const serviceId = document.getElementById('userServiceSelect').value;
            const operatorId = document.getElementById('userOperatorSelect').value;
            const card = document.getElementById('priceInfoCard');

            if (!countryId || !serviceId) return card.classList.add('hidden');
            card.classList.remove('hidden');
            
            document.getElementById('dispFinalPrice').innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i>';

            let url = `${BACKEND_URL}/api/price-estimate?country_id=${countryId}&platform_id=${serviceId}`;
            if (operatorId) url += `&operator_id=${operatorId}`;

            try {
                const res = await fetch(url).then(r => r.json());
                if (res.success) {
                    selectedProductTier = res.data;
                    document.getElementById('dispStock').innerText = res.data.available;
                    document.getElementById('dispFinalPrice').innerText = `Rp ${res.data.user_price.toLocaleString('id-ID')}`;
                } else {
                    document.getElementById('dispStock').innerText = '0';
                    document.getElementById('dispFinalPrice').innerText = 'Out of Stock';
                    selectedProductTier = null;
                }
            } catch(e) {
                document.getElementById('dispFinalPrice').innerText = 'Error';
            }
        }

        async function executeOrderNokos() {
            if (!selectedProductTier) return Swal.fire({icon: 'warning', text: 'Stock unavailable!', background: '#16161f', color: '#fff'});

            const btn = document.getElementById('btnOrderNokos');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uid: currentUserData.uid,
                        catalog_product_id: selectedProductTier.catalog_product_id
                    })
                }).then(r => r.json());

                if (res.success) {
                    Swal.fire({
                        icon: 'success', 
                        title: 'Order Placed!', 
                        text: `Number: ${res.data.order.phone_number}`,
                        background: '#16161f', color: '#fff', confirmButtonColor: '#ff4d4d'
                    });
                    pollActiveOrders();
                } else {
                    Swal.fire({icon: 'error', text: res.error.message, background: '#16161f', color: '#fff'});
                }
            } catch (e) {
                Swal.fire({icon: 'error', text: 'Server error.', background: '#16161f', color: '#fff'});
            } finally {
                btn.innerHTML = 'Place Order <i class="fa-solid fa-arrow-right"></i>';
                btn.disabled = false;
            }
        }

        async function pollActiveOrders() {
            if (!currentUserData) return;
            try {
                const snap = await db.ref('orders').orderByChild('uid').equalTo(currentUserData.uid).once('value');
                const localOrders = snap.val() || {};
                
                // Fetch status dari server
                const activeRes = await fetch(`${BACKEND_URL}/api/orders/active`).then(r => r.json());
                const liveMap = new Map();
                if (activeRes.success && activeRes.data) {
                    // API v2 array ada di res.data
                    const ordersArr = Array.isArray(activeRes.data) ? activeRes.data : (activeRes.data.orders || []);
                    ordersArr.forEach(o => liveMap.set(o.id, o));
                }

                const container = document.getElementById('userOrdersContainer');
                const keys = Object.keys(localOrders);
                
                if (keys.length === 0) {
                    return container.innerHTML = `<div class="p-8 text-center text-gray-500 text-sm">No orders found. Place an order to see it here.</div>`;
                }

                container.innerHTML = '';
                keys.reverse().forEach(k => {
                    const ord = localOrders[k];
                    const live = liveMap.get(ord.order_id);
                    
                    const status = live ? live.status : ord.status;
                    const otp = live ? live.otp_code : null;
                    
                    // Styling status ala SMSCode
                    let statusHtml = '';
                    if (status === 'ACTIVE') statusHtml = `<span class="text-xs font-bold text-gray-300">ACTIVE</span>`;
                    else if (status === 'CANCELED') statusHtml = `<span class="text-xs font-bold text-brand-accent bg-brand-accent/10 px-2 py-0.5 rounded">CANCELED</span>`;
                    else if (status === 'COMPLETED') statusHtml = `<span class="text-xs font-bold text-brand-success bg-brand-success/10 px-2 py-0.5 rounded">COMPLETED</span>`;
                    else statusHtml = `<span class="text-xs font-bold text-gray-500">${status}</span>`;

                    container.innerHTML += `
                        <div class="bg-[#1a1a24] border border-[#2a2a35] p-4 rounded-xl flex flex-col gap-3 hover:border-gray-600 transition-colors">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <span class="text-gray-500 text-xs font-mono">#${ord.order_id}</span>
                                    <span class="text-white font-semibold">${ord.phone}</span>
                                </div>
                                ${statusHtml}
                            </div>
                            
                            <div class="flex justify-between items-center text-xs text-gray-400">
                                <span><i class="fa-solid fa-tag mr-1"></i> Rp ${ord.cost_user.toLocaleString('id-ID')}</span>
                            </div>

                            ${status === 'ACTIVE' ? `
                                <div class="bg-[#0d0d12] p-3 rounded-lg border border-[#2a2a35] flex justify-between items-center mt-1">
                                    <div class="font-mono text-sm ${otp ? 'text-brand-success font-bold text-lg tracking-wider' : 'text-gray-500 animate-pulse'}">
                                        ${otp || 'Waiting for SMS...'}
                                    </div>
                                    <button onclick="cancelOrder(${ord.order_id})" class="text-xs font-semibold text-brand-accent hover:bg-brand-accent/10 px-3 py-1.5 rounded transition-colors">Cancel</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function cancelOrder(id) {
            const btn = event.target;
            btn.innerText = '...';
            btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/order/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: id, uid: currentUserData.uid })
                }).then(r => r.json());

                if (res.success) {
                    Swal.fire({icon: 'success', title: 'Canceled', text: 'Order canceled & refunded.', background: '#16161f', color: '#fff', timer: 1500, showConfirmButton: false});
                    pollActiveOrders();
                } else {
                    Swal.fire({icon: 'error', text: 'Gagal cancel order.', background: '#16161f', color: '#fff'});
                    btn.innerText = 'Cancel';
                    btn.disabled = false;
                }
            } catch(e) {
                btn.innerText = 'Cancel';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
