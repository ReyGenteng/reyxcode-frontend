<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reyxcode | Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { bg: '#0d0d12', card: '#16161f', accent: '#ff4d4d', success: '#00e57a', border: '#2a2a35' } } } } }
    </script>
    <style>body { background-color: #0d0d12; color: #f1f5f9; font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="sticky top-0 z-50 bg-[#0d0d12]/90 backdrop-blur-md border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="font-bold text-xl tracking-tight">reyx<span class="text-brand-accent">code</span> <span class="text-xs bg-brand-accent text-white px-2 py-0.5 rounded ml-1">ADMIN</span></span>
            </div>
            <button onclick="logoutAdmin()" class="text-sm text-gray-400 hover:text-white flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full">
        <!-- Tabs -->
        <div class="flex gap-4 border-b border-brand-border mb-6">
            <button onclick="switchTab('users')" id="tab-users" class="px-4 py-3 font-semibold text-brand-accent border-b-2 border-brand-accent">Manage Users</button>
            <button onclick="switchTab('tickets')" id="tab-tickets" class="px-4 py-3 font-semibold text-gray-400 hover:text-white border-b-2 border-transparent">Support Tickets</button>
        </div>

        <!-- USERS TAB -->
        <div id="view-users" class="bg-[#16161f] border border-[#2a2a35] rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-400 uppercase bg-[#111118] border-b border-[#2a2a35]">
                        <tr>
                            <th class="px-6 py-4">Username</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Saldo (IDR)</th>
                            <th class="px-6 py-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminUserTable" class="divide-y divide-[#2a2a35]"></tbody>
                </table>
            </div>
        </div>

        <!-- TICKETS TAB -->
        <div id="view-tickets" class="hidden bg-[#16161f] border border-[#2a2a35] rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4">Customer Tickets</h2>
            <div id="adminTicketContainer" class="space-y-4"></div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBbW70TerXmSJcPgc7Lsj4Mjd35DDrPM0I",
            authDomain: "reystore-777b5.firebaseapp.com",
            databaseURL: "https://reystore-777b5-default-rtdb.firebaseio.com",
            projectId: "reystore-777b5",
            storageBucket: "reystore-777b5.firebasestorage.app",
            messagingSenderId: "1075601006300",
            appId: "1:1075601006300:web:2e82a477211dfdce9c5e19"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref(`users/${user.uid}`).once('value', snap => {
                    const u = snap.val();
                    if (!u || u.role !== 'admin') window.location.replace("user.html");
                    else { loadUsers(); loadTickets(); }
                });
            } else window.location.replace("index.html");
        });

        function logoutAdmin() { auth.signOut().then(() => window.location.replace("index.html")); }

        function switchTab(tab) {
            document.getElementById('view-users').classList.add('hidden');
            document.getElementById('view-tickets').classList.add('hidden');
            document.getElementById('tab-users').className = 'px-4 py-3 font-semibold text-gray-400 hover:text-white border-b-2 border-transparent';
            document.getElementById('tab-tickets').className = 'px-4 py-3 font-semibold text-gray-400 hover:text-white border-b-2 border-transparent';
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'px-4 py-3 font-semibold text-brand-accent border-b-2 border-brand-accent';
        }

        function loadUsers() {
            db.ref('users').on('value', snap => {
                const users = snap.val() || {};
                const tbody = document.getElementById('adminUserTable');
                tbody.innerHTML = '';
                
                Object.keys(users).forEach(uid => {
                    const u = users[uid];
                    const statusBadge = u.banned ? `<span class="bg-red-500/20 text-red-500 px-2 py-1 rounded text-xs">BANNED</span>` : `<span class="bg-green-500/20 text-green-500 px-2 py-1 rounded text-xs">ACTIVE</span>`;
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-[#1a1a24]">
                            <td class="px-6 py-4 font-semibold">${u.username || 'User'}<br><span class="text-xs text-gray-400">${u.email}</span></td>
                            <td class="px-6 py-4">${statusBadge}</td>
                            <td class="px-6 py-4 font-mono text-right">Rp ${(u.balance || 0).toLocaleString('id-ID')}</td>
                            <td class="px-6 py-4 text-center space-x-2">
                                <button onclick="editBalance('${uid}', ${u.balance || 0})" class="text-xs bg-[#2a2a35] hover:bg-white hover:text-black px-3 py-1.5 rounded">Edit Saldo</button>
                                ${u.banned 
                                    ? `<button onclick="unbanUser('${uid}')" class="text-xs bg-green-500/20 text-green-500 px-3 py-1.5 rounded">Unban</button>`
                                    : `<button onclick="banUser('${uid}')" class="text-xs bg-brand-accent/20 text-brand-accent px-3 py-1.5 rounded">Ban User</button>`
                                }
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function editBalance(uid, currentBal) {
            Swal.fire({
                title: 'Update Saldo', input: 'number', inputValue: currentBal,
                background: '#16161f', color: '#fff', showCancelButton: true
            }).then(res => {
                if (res.isConfirmed && res.value !== '') db.ref(`users/${uid}/balance`).set(parseFloat(res.value));
            });
        }

        function banUser(uid) {
            Swal.fire({title: 'Ban User?', text: "User tidak akan bisa login lagi.", icon: 'warning', showCancelButton: true, background: '#16161f', color: '#fff', confirmButtonColor: '#ff4d4d'}).then((result) => {
                if (result.isConfirmed) db.ref(`users/${uid}/banned`).set(true);
            });
        }

        function unbanUser(uid) { db.ref(`users/${uid}/banned`).set(null); }

        function loadTickets() {
            db.ref('tickets').on('value', snap => {
                const tickets = snap.val() || {};
                const container = document.getElementById('adminTicketContainer');
                container.innerHTML = '';
                
                Object.keys(tickets).reverse().forEach(tid => {
                    const t = tickets[tid];
                    container.innerHTML += `
                        <div class="bg-[#1a1a24] p-4 rounded-lg border border-[#2a2a35]">
                            <div class="flex justify-between mb-2">
                                <h4 class="font-bold text-white">${t.subject} <span class="text-xs text-gray-500 font-normal ml-2">from: ${t.email}</span></h4>
                                ${t.status === 'open' ? `<span class="bg-yellow-500/20 text-yellow-500 px-2 py-0.5 rounded text-xs">OPEN</span>` : `<span class="bg-gray-500/20 text-gray-400 px-2 py-0.5 rounded text-xs">CLOSED</span>`}
                            </div>
                            <p class="text-sm text-gray-400 mb-3">${t.message}</p>
                            ${t.status === 'open' ? `<button onclick="closeTicket('${tid}')" class="text-xs bg-brand-accent/20 text-brand-accent px-3 py-1.5 rounded">Mark as Resolved / Close</button>` : ''}
                        </div>
                    `;
                });
            });
        }

        function closeTicket(tid) { db.ref(`tickets/${tid}/status`).set('closed'); }
    </script>
</body>
</html>
